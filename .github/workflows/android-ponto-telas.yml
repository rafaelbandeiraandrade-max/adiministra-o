name: App Android - Capturas de tela

on:
  push:
    paths:
      - "android-ponto/app/**"
      - ".github/workflows/android-ponto-telas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-ponto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Gerar capturas
        run: |
          chmod +x gradlew
          ./gradlew recordRoborazziDebug --tests "com.ceharp.ponto.CapturaTelasTest" --stacktrace
      - name: Salvar capturas na pasta telas/
        run: |
          rm -rf telas && mkdir telas
          cp app/telas-geradas/*.png telas/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telas
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza capturas de tela do app"
            git pull --rebase
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-de-tela
          path: android-ponto/app/telas-geradas/
